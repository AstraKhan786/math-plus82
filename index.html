let rng=Math.random;const r=(a,b)=>a+Math.floor(rng()*(b-a+1)),pk=a=>a[r(0,a.length-1)],pk0=a=>a[Math.floor(Math.random()*a.length)];

["pct","Percentages",0,"",d=>{const p=r(1,9)*5,N=r(2,8+4*d)*20,a=p*N/100;return[`What is ${p}% of ${N}?`,a,"Write the percentage as a fraction of 100, then multiply.",[`${p}% of ${N} = ${p}/100 × ${N}`,`= ${a}`]]}],
["lin","Linear equations",2,"",d=>{const a=r(2,4+3*d),x=r(-9,9),b=r(-9,9),c=a*x+b;return[`Solve ${a}x${t(b,"")} = ${c}. Find x.`,x,"Move the constant to the right-hand side, then divide by the coefficient of x.",[`${a}x = ${c} − (${b}) = ${c-b}`,`x = ${c-b} ÷ ${a} = ${x}`]]}],

["det","Matrices (determinant)",4,"G11 Ch 5",d=>{const a=r(-4,5+d),b=r(-5,5),c=r(-5,5),e=r(-4,5+d),D=a*e-b*c;return[`Find det A for A = ( ${a}  ${b} ; ${c}  ${e} ), written row by row.`,D,"det = (top-left × bottom-right) − (top-right × bottom-left).",[`det A = ad − bc`,`= (${a})(${e}) − (${b})(${c})`,`= ${D}`]]}],
